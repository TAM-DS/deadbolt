name: DeadBolt secret & agent-authority scan
description: Offline scan for leaked credentials, risky MCP/agent configs, git history and container layers. Emits SARIF.
branding:
  icon: lock
  color: red
inputs:
  path:
    description: Path to scan
    default: "."
  history:
    description: Also scan git history (requires fetch-depth 0)
    default: "true"
  fail-on:
    description: Minimum severity that fails the job (info|low|medium|high|critical)
    default: high
  sarif:
    description: SARIF output path
    default: deadbolt.sarif
runs:
  using: composite
  steps:
    - shell: bash
      env:
        DEADBOLT_ACTION_PATH: ${{ github.action_path }}
      run: pip install --quiet "$DEADBOLT_ACTION_PATH"
    - shell: bash
      env:
        DEADBOLT_SCAN_PATH: ${{ inputs.path }}
        DEADBOLT_FAIL_ON: ${{ inputs.fail-on }}
        DEADBOLT_SARIF: ${{ inputs.sarif }}
        DEADBOLT_HISTORY: ${{ inputs.history }}
      run: |
        args=(audit "$DEADBOLT_SCAN_PATH" --fail-on "$DEADBOLT_FAIL_ON" --format sarif --output "$DEADBOLT_SARIF")
        if [ "$DEADBOLT_HISTORY" = "true" ]; then args+=(--history); fi
        deadbolt "${args[@]}"
