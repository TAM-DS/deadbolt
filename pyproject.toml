[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deadbolt-scanner"
version = "0.1.0"
description = "Offline secret & agent-authority scanner: leaked keys, MCP configs, agent grants, git history, container layers — with deterministic blast-radius triage."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Tracy Manning" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["security", "secrets", "secret-scanning", "mcp", "agentic-ai", "sarif", "devsecops", "supply-chain"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Operating System :: POSIX :: Linux",
  "Topic :: Security",
  "Environment :: Console",
]

[project.urls]
Homepage = "https://github.com/TAM-DS/deadbolt"

[project.scripts]
deadbolt = "deadbolt.cli:main"

[tool.setuptools]
packages = ["deadbolt"]
